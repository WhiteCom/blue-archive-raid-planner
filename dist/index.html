<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf4fb">
  <meta name="description" content="블루 아카이브 총력전 학생 편성을 준비하고 EX 스킬 순서를 연습하세요.">
  <title>블루 아카이브 총력전 시뮬레이터</title>
  <link rel="stylesheet" href="style.css">
  <script src="students.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true"></span>총력전 플래너</div>
      <a class="source-link" href="https://github.com/SchaleDB/SchaleDB" target="_blank" rel="noopener">학생 데이터 <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">BLUE ARCHIVE <span></span> TOTAL ASSAULT</p>
        <h1>총력전 시뮬레이터</h1>
        <p class="intro-copy">학생 6명을 편성하고 EX 스킬을 사용할 순서와 대상을 정하세요.</p>
      </div>
      <button type="button" id="example" class="button outline">예제 불러오기</button>
    </section>

    <div class="workspace">
      <form id="editor" class="editor" novalidate>
        <section class="card roster-card" aria-labelledby="roster-title">
          <header class="section-head">
            <h2 id="roster-title">학생 편성</h2>
            <span class="count" id="roster-count"></span>
          </header>
          <div id="roster" class="roster"></div>
        </section>

        <section class="card order-card" aria-labelledby="order-title">
          <header class="section-head">
            <h2 id="order-title">스킬 순서</h2>
            <button type="button" id="add" class="button compact outline"><span aria-hidden="true">＋</span> 단계 추가</button>
          </header>
          <div class="editor-head" aria-hidden="true"><span>순서</span><span>사용 학생</span><span></span><span>스킬 대상</span><span></span></div>
          <ol id="steps" class="edit-steps"></ol>
          <p id="form-status" class="form-status" role="status"></p>
          <div class="editor-actions">
            <button type="submit" class="button primary apply">OK <span>·</span> 적용하기</button>
          </div>
        </section>
      </form>

      <section class="card sequence-card" aria-labelledby="sequence-title">
        <header class="section-head">
          <h2 id="sequence-title">스킬 진행</h2>
          <span id="progress" class="count"></span>
        </header>
        <div id="summary" class="summary"></div>
        <ol class="sequence" id="sequence"></ol>
        <p id="sequence-status" class="sr-only" role="status"></p>
        <div class="sequence-actions">
          <button type="button" id="restart" class="button outline reset" aria-label="처음부터" title="처음부터"><span aria-hidden="true">↺</span></button>
          <div class="move-buttons">
            <button type="button" id="previous" class="button outline">이전</button>
            <button type="button" id="next" class="button primary">다음 단계</button>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <span>블루 아카이브 팬 도구</span>
      <span>학생 데이터 및 아이콘 <a href="https://github.com/SchaleDB/SchaleDB" target="_blank" rel="noopener">SchaleDB</a> · <a href="https://github.com/nico0748/SchaleDB" target="_blank" rel="noopener">보완 데이터</a></span>
    </footer>
  </main>

  <dialog id="student-picker" aria-labelledby="picker-title">
    <div class="dialog-head">
      <div><h2 id="picker-title">학생 선택</h2><p id="picker-slot"></p></div>
      <button type="button" id="close-picker" class="button outline icon-button" aria-label="닫기">×</button>
    </div>
    <label class="sr-only" for="search">학생 이름 검색</label>
    <input type="search" id="search" placeholder="학생 이름 검색" autocomplete="off">
    <p id="search-status" class="sr-only" role="status"></p>
    <div class="student-results" id="student-results"></div>
    <div class="dialog-foot"><button type="button" id="clear-slot" class="button outline">이 자리 비우기</button></div>
  </dialog>
</body>
</html>
